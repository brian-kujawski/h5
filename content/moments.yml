# Moment taxonomy: the occasions shown as tiles on the Circle tab.
#
# PROPOSED, NOT YET AGREED. Agreeing this list is a Phase 0 gate.
# The main tiles follow the DeMon H3 ending-circle running order, which is
# when the RA asks the pack for a song. Every `moments:` value in
# content/songs/*.md must be an id below, or `npm run content` fails.
#
# Fields:
#   id        stable id used in song files (kebab-case, never rename once shipped)
#   name      display name, sentence case
#   blurb     one line shown under the tile
#   icon      Phosphor icon name (https://phosphoricons.com)
#   group     circle = the main tiles, in running order
#             extra  = shown under "More moments"
#   includes  optional: other moment ids whose songs also show on this tile,
#             listed after the songs tagged with this moment directly
#
# Order in this file is the display order.

# --- Ending circle, in DeMon running order ---

- id: hares
  name: Hares
  blurb: What's your excuse?
  icon: Rabbit
  group: circle
  includes: [trail-complaint]

