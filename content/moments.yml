# Moment taxonomy: the occasions shown as tiles on the Circle tab.
#
# PROPOSED, NOT YET AGREED. Agreeing this list is a Phase 0 gate.
# It merges the plan's starting set with the tags already used in the seed
# songbook. Every `moments:` value in content/songs/*.md must be an id below,
# or `npm run content` fails.
#
# Fields:
#   id      stable id used in song files (kebab-case, never rename once shipped)
#   name    display name, sentence case
#   blurb   one line shown under the tile
#   icon    Phosphor icon name (https://phosphoricons.com)
#   group   circle   = the main tiles, in the order a circle usually runs
#           extra    = shown under "More moments"
#
# Order in this file is the display order.

- id: opening
  name: Opening circle
  blurb: Kick things off
  icon: MegaphoneSimple
  group: circle

- id: hares
  name: Hares
  blurb: Honour (or roast) the hares
