# Moment taxonomy: the occasions shown as tiles on the Circle tab.
#
# PROPOSED, NOT YET AGREED. Agreeing this list is a Phase 0 gate.
# The main tiles follow the DeMon H3 ending-circle running order, which is
# when the RA asks the pack for a song. Every `moments:` value in
# content/songs/*.md must be an id below, or `npm run content` fails.
#
# Fields:
#   id        stable id used in song files (kebab-case, never rename once shipped)
#   name      display name, sentence case
#   blurb     one line shown under the tile
#   icon      Phosphor icon name (https://phosphoricons.com)
#   group     circle = the main tiles, in running order
#             extra  = shown under "More moments"
#   includes  optional: other moment ids whose songs also show on this tile,
#             listed after the songs tagged with this moment directly
#
# Order in this file is the display order.

# --- Ending circle, in DeMon running order ---

- id: opening
  name: Circle up
  blurb: Start the ending circle
  icon: MegaphoneSimple
  group: circle

- id: hares
  name: Hares
  blurb: What's your excuse?
  icon: Rabbit
  group: circle
  includes: [trail-complaint]

- id: virgin
  name: Virgins
  blurb: Teach them the art of a down-down
  icon: Plant
  group: circle

- id: visitor
  name: Visitors
  blurb: Hashers from other kennels
  icon: Backpack
  group: circle

- id: fastest-runner
  name: FRB
  blurb: Front-running bastard, and next hare
  icon: Lightning
  group: circle

- id: accusations
  name: Accusations
  blurb: Accolades and tales from trail
  icon: Siren
  group: circle
  includes: [trail-mishap, etiquette-breach, too-drunk, new-shoes, last-in, autohash]

- id: birthday
  name: Hashy birthdays
  blurb: Birthdays and anniversaries
  icon: Cake
  group: circle
  includes: [anniversary]

- id: returner
  name: Backsliders
  blurb: Missed two or more hashes
  icon: ArrowUUpLeft
  group: circle

- id: closing
  name: May the hash go in peace
  blurb: Last song of the night
  icon: MoonStars
  group: circle

# --- Any time ---

- id: any-down-down
  name: Any down-down
  blurb: Works for anyone in the middle
  icon: BeerStein
  group: circle

- id: group-song
  name: Whole circle
  blurb: Everyone sings
  icon: UsersThree
  group: circle

